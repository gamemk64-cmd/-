<!DOCTYPE html>
<html lang="ru" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1f8;--pn:#fff;--pn2:#ebe6f3;--tx:#1e1932;--mu:#6d6585;--ac:#c77d0a;--ln:#d9d2e6}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0912;--pn:#16121f;--pn2:#241e36;--tx:#ece8f5;--mu:#9c94b5;--ac:#f2b84b;--ln:#322c4a}}
:root[data-theme="dark"]{--bg:#0b0912;--pn:#16121f;--pn2:#241e36;--tx:#ece8f5;--mu:#9c94b5;--ac:#f2b84b;--ln:#322c4a}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:grid;grid-template-columns:200px 1fr;grid-template-rows:1fr auto;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:10px;padding:6px 10px}
button:hover{background:var(--pn2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#side{background:var(--pn);padding:16px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--ln);overflow:auto}
#side h1{font-size:18px;margin:0 8px 14px;letter-spacing:-.02em}
#nav button{display:block;width:100%;text-align:left;padding:9px 12px}
#nav button.on{background:var(--pn2);color:var(--ac);font-weight:600}
.add{margin-top:12px;background:var(--ac)!important;color:#1a1200!important;font-weight:600;text-align:center}
#main{overflow:auto;padding:24px 28px 20px}
h2{font-size:22px;margin:0 0 14px;letter-spacing:-.02em}h3{margin:22px 0 8px;font-size:15px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],input[type=text],select{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
input[type=search]{flex:1;min-width:160px}
.row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--pn)}.row.on{background:var(--pn2)}.row.on b{color:var(--ac)}
.cv{width:42px;height:42px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:18px;color:#fff8}
.tt{flex:1;min-width:0}.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small,.d{color:var(--mu)}.d{font-variant-numeric:tabular-nums;font-size:12px}
.row button.hot{color:#ff5e87}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--pn);border-radius:16px;padding:14px}.stat b{font-size:26px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--pn);border-radius:16px;padding:12px;cursor:pointer}.card .cv{width:100%;height:110px;margin-bottom:8px;border-radius:12px;font-size:34px}
.empty{color:var(--mu);padding:30px 0;text-align:center;border:1px dashed var(--ln);border-radius:16px}
#pl{grid-column:1/3;background:var(--pn);border-top:1px solid var(--ln);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);align-items:center;gap:12px;padding:10px 16px}
#now{display:flex;gap:10px;align-items:center;min-width:0}
#ctl{display:flex;flex-direction:column;gap:4px;align-items:center}
#ctl div{display:flex;gap:4px;align-items:center}
#ctl .pp{background:var(--ac);color:#1a1200;width:40px;height:40px;border-radius:50%;padding:0;font-size:16px}
#ctl .on{color:var(--ac)}
#sk{display:flex;gap:8px;align-items:center;width:100%}#sk input{flex:1}
input[type=range]{accent-color:var(--ac)}
#vol{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.eq{display:flex;gap:26px;align-items:flex-end;margin-top:16px}.eq label{display:flex;flex-direction:column;align-items:center;gap:6px}
.eq input{writing-mode:vertical-lr;direction:rtl;height:150px}
.menu{position:fixed;z-index:9;background:var(--pn2);border-radius:12px;padding:4px;box-shadow:0 8px 30px #0006;min-width:190px}
.menu button{display:block;width:100%;text-align:left}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;background:#000a;color:#fff;display:none;place-items:center;font-size:24px;z-index:20}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60vmax 50vmax at 12% 8%,hsl(var(--h,40) 85% 52%/calc(.16 + var(--b,0)*.3)),transparent 62%),radial-gradient(55vmax 45vmax at 92% 92%,hsl(calc(var(--h,40) + 70) 85% 52%/calc(.12 + var(--b,0)*.24)),transparent 62%)}
#side,#main,#pl{position:relative;z-index:1}
#side,#pl{background:color-mix(in srgb,var(--pn) 60%,transparent);backdrop-filter:blur(22px) saturate(140%)}
.stat,.card{background:color-mix(in srgb,var(--pn) 62%,transparent);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--tx) 8%,transparent)}
.card:hover{border-color:var(--ac)}
.row.on{background:color-mix(in srgb,var(--ac) 16%,transparent)}
#pc{box-shadow:0 4px 18px hsl(var(--h,40) 80% 45%/.5)}
.hero{display:flex;gap:34px;align-items:center;flex-wrap:wrap;margin-top:10px}
.big{width:min(300px,70vw);aspect-ratio:1;border-radius:28px;display:grid;place-items:center;font-size:110px;color:#fff9;box-shadow:0 24px 80px hsl(var(--h,40) 80% 45%/.55);transform:scale(calc(1 + var(--b,0)*.05));transition:transform .09s}
.hi{flex:1;min-width:260px}.hi h2{font-size:34px;line-height:1.1;margin-bottom:6px}
.chip{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--pn2);color:var(--ac);font-size:12px;margin:8px 0 14px}
#vz{width:100%;max-width:800px;aspect-ratio:10/3;height:auto;display:block}
.vmb.on{background:var(--pn2);color:var(--ac)}
.tp{margin:6px 0 14px;max-width:800px}.tr{display:flex;gap:10px;align-items:center}.tr input{flex:1}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}.tb button{font-size:15px}.tb .on{color:var(--ac);background:var(--pn2)}
.tb .pp2{background:var(--ac);color:#1a1200;width:56px;height:56px;border-radius:50%;font-size:22px;padding:0}
#bgart{position:fixed;inset:-8%;z-index:0;pointer-events:none;opacity:.3;filter:blur(70px) saturate(1.5);background-size:cover;transition:opacity .6s}
.big{transition:transform .05s linear;will-change:transform}
#pc{will-change:transform}
h2{font-size:27px;font-weight:800;letter-spacing:-.03em}
#nav button.on{box-shadow:inset 3px 0 0 var(--ac)}
button{transition:background .15s,transform .1s}button:active{transform:scale(.94)}
.row.on .cv{box-shadow:0 0 18px hsl(var(--h,40) 80% 50%/.6)}
#pl{transition:box-shadow .08s}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}#side{flex-direction:row;overflow-x:auto;padding:8px;border:0}#side h1{display:none}#nav{display:flex}#nav button{white-space:nowrap}.add{margin:0 0 0 6px}#pl{grid-column:1;grid-template-columns:1fr}#vol{display:none}.d.s{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="bgart"></div>
<div id="amb"></div>
<aside id="side"><h1>Music Player</h1><div id="nav"></div>
<button class="add" id="b1">Добавить музыку</button><button class="add" id="b2" style="margin-top:6px!important">Добавить папку</button></aside>
<main id="main"></main>
<footer id="pl">
<div id="now"><div class="cv" id="pc">♪</div><div class="tt"><b id="pt">Ничего не играет</b><small id="pa">Добавьте музыку</small></div><button id="pf" title="Избранное">♥</button></div>
<div id="ctl"><div><button id="sh" title="Shuffle">⇄</button><button id="pv" title="Назад">⏮</button><button class="pp" id="pp" title="Play / Pause (Space)">▶</button><button id="nx" title="Вперёд">⏭</button><button id="rp" title="Repeat">↻</button></div>
<div id="sk"><span class="d" id="tc">00:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span class="d" id="td">00:00</span></div></div>
<div id="vol"><span class="chip" id="duckb" style="display:none;margin:0">приглушено</span><button id="mu">🔊</button><input type="range" id="vr" min="0" max="100" aria-label="Громкость"></div>
</footer>
<div id="toast"></div><div id="drop">Отпустите файлы, чтобы добавить</div>
<input type="file" id="fi" accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.opus,audio/*" multiple hidden>
<input type="file" id="fd" webkitdirectory multiple hidden>
<input type="file" id="fc" accept="image/*" hidden>
<audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let S=Object.assign({pl:[],fav:[],hist:[],vol:.8,shuf:false,rep:0,eq:[0,0,0,0,0],q:[],cur:null,pos:0},LS('mp',{}));
const persist=()=>{try{localStorage.setItem('mp',JSON.stringify(S))}catch{}
  for(const id of new Set([...S.fav,...S.q,...S.pl.flatMap(p=>p.ids)])){const t=T.get(id);if(t&&t.tmp){delete t.tmp;put(t)}}};
const T=new Map();let db,view='home',Q='',SO='added',openPl=null,LIST=[],REORD=null,ctxList=[],played=new Set(),url,ctx,filt=[],dragI=null,muted=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const mb=b=>(b/1048576).toFixed(1)+' МБ';
const hue=t=>{let h=0;for(const c of t.id)h=(h*31+c.charCodeAt(0))%360;return t.hue??h};
const cv=t=>{if(t.curl)return `background:url("${t.curl}") center/cover,hsl(${hue(t)} 45% 30%)`;if(t.cover&&!t.cu)t.cu=URL.createObjectURL(t.cover);const h=hue(t);return t.cu?`background:url(${t.cu}) center/cover`:`background:radial-gradient(circle at 28% 22%,hsl(${h} 75% 62%),transparent 58%),linear-gradient(140deg,hsl(${h} 55% 38%),hsl(${(h+70)%360} 60% 20%))`};
const ini=t=>t.cover||t.curl?'':esc((t.title||'♪')[0].toUpperCase());
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
/* ---------- storage ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('mp',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('t',m),r=f(t.objectStore('t'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej()});
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);const d=v=>{URL.revokeObjectURL(u);r(v)};a.preload='metadata';a.onloadedmetadata=()=>d(a.duration||0);a.onerror=()=>d(0);setTimeout(()=>d(0),3000);a.src=u});
async function imp(files){
  files=[...files].filter(f=>/\.(mp3|wav|flac|ogg|m4a|aac|opus)$/i.test(f.name));
  if(!files.length)return toast('Подходящих аудиофайлов не найдено');
  let n=0;
  for(const f of files){
    if([...T.values()].some(t=>t.file&&t.file.name===f.name&&t.size===f.size))continue;
    const b=f.name.replace(/\.[^.]+$/,''),p=b.split(' - '),id=crypto.randomUUID();
    const g=await tags(f);const tr={id,file:f,tg:1,genre:g.genre||'',year:g.year||'',cover:g.cover||null,artist:g.artist||(p.length>1?p[0].trim():'Неизвестный исполнитель'),title:g.title||(p.length>1?p.slice(1).join(' - '):b).trim(),
      album:g.album||(f.webkitRelativePath?(f.webkitRelativePath.split('/').slice(-2,-1)[0]||'—'):'—'),fmt:f.name.split('.').pop().toUpperCase(),size:f.size,added:Date.now()+n,dur:await dur(f)};
    await put(tr);
    T.set(id,tr);n++;if(n%5==0)toast(`Добавлено ${n} из ${files.length}`);
  }
  toast(`Добавлено песен: ${n}`);render();
}
/* ---------- audio / EQ ---------- */
const BANDS=[60,230,910,3600,14000],PRE={Flat:[0,0,0,0,0],Rock:[5,3,-2,3,5],Pop:[-1,3,5,2,-1],Electronic:[6,3,0,2,5],Classical:[4,2,-1,3,4],Bass:[8,5,0,-1,-2],Vocal:[-2,1,5,4,1],Gaming:[4,0,2,5,3]};
function initAudio(){if(ctx)return;ctx=new AudioContext();let n=ctx.createMediaElementSource(au);an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.82;n.connect(an);BANDS.forEach((f,i)=>{const b=ctx.createBiquadFilter();b.type=i==0?'lowshelf':i==4?'highshelf':'peaking';b.frequency.value=f;b.gain.value=S.eq[i];n.connect(b);n=b;filt.push(b)});cm=ctx.createDynamicsCompressor();cm.attack.value=.003;cm.release.value=.2;setNight();lev=ctx.createGain();n.connect(lev);lev.connect(cm);mg=ctx.createGain();mg.gain.value=0;cm.connect(mg);mg.connect(ctx.destination);au.volume=1;applyVol()}
function play(id,list,pos){
  if(ctx&&mg&&!au.paused&&pos===undefined&&ctx.state=='running'){fadeG=0;applyVol();clearTimeout(play.t);play.t=setTimeout(()=>{play0(id,list,pos);fadeG=1;applyVol()},170)}
  else{play0(id,list,pos);fadeG=1;applyVol()}}
function play0(id,list,pos){
  const t=T.get(id);if(!t)return;initAudio();ctx.resume();if(list){ctxList=list;S.ctx=list}
  if(url)URL.revokeObjectURL(url);if(t.src){url=null;au.crossOrigin='anonymous';au.src=t.src}else{au.removeAttribute('crossorigin');url=URL.createObjectURL(t.file);au.src=url}
  if(pos)au.addEventListener('loadedmetadata',()=>{au.currentTime=pos},{once:true});
  if(pos===undefined){au.play().catch(()=>{});played.add(id);
    const h=S.hist.find(x=>x.id==id);S.hist=[{id,at:Date.now(),n:(h?h.n:0)+1},...S.hist.filter(x=>x.id!=id)].slice(0,300)}
  S.cur=id;vibe(t);persist();ui();if(view=='now')render();
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album});
}
function next(auto){
  if(auto&&S.rep==2){au.currentTime=0;au.play();return}
  while(S.q.length){const id=S.q.shift();if(T.has(id)){return play(id)}}
  const l=ctxList.filter(x=>T.has(x));if(!l.length)return;let id;const i=l.indexOf(S.cur);
  if(S.shuf){const r=l.filter(x=>!played.has(x));
    if(r.length)id=r[Math.random()*r.length|0];
    else if(S.rep==1||!auto){played.clear();const o=l.filter(x=>x!=S.cur);id=(o.length?o:l)[Math.random()*(o.length||l.length)|0]}
    else{au.pause();return}}
  else if(i+1>=l.length){if(S.rep==1||!auto)id=l[0];else{au.pause();return}}
  else id=l[i+1];
  play(id)}
function prev(){if(au.currentTime>3)return au.currentTime=0;const l=ctxList.filter(x=>T.has(x)),i=l.indexOf(S.cur);play(l[i>0?i-1:l.length-1]||S.cur)}
const toggle=()=>{if(!au.src&&S.cur)return play(S.cur);if(au.paused){initAudio();ctx.resume();au.play();fadeG=1;applyVol()}else fadePause()};
const setVol=v=>{S.vol=Math.min(1,Math.max(0,v));applyVol();$('#vr').value=S.vol*100;$('#mu').textContent=S.vol==0||muted?'🔇':'🔊';persist()};
au.onended=()=>next(true);
au.onplay=au.onpause=()=>{$('#pp').textContent=au.paused?'▶':'⏸'};
au.onerror=()=>{if(!au.src)return;toast('Не удаётся воспроизвести файл — пропускаю');console.error('Ошибка воспроизведения',S.cur);setTimeout(()=>next(true),800)};
au.ontimeupdate=()=>{const d=au.duration||0;$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(d);if(!seeking)$('#seek').value=d?au.currentTime/d*1000:0;S.pos=au.currentTime};
let seeking=false;const sk=$('#seek');sk.oninput=()=>{seeking=true};sk.onchange=()=>{au.currentTime=sk.value/1000*(au.duration||0);seeking=false};
setInterval(()=>{if(!au.paused)persist()},3000);
/* ---------- UI ---------- */
function ui(){
  const t=T.get(S.cur);
  $('#pt').textContent=t?t.title:'Ничего не играет';$('#pa').textContent=t?t.artist:'Добавьте музыку';
  $('#pc').style.cssText=t?cv(t):'';$('#pc').textContent=t?ini(t):'♪';$('#pf').className=t&&S.fav.includes(t.id)?'hot':'';$('#pf').style.color=S.fav.includes(S.cur)?'#ff5e87':'';
  $('#sh').className=S.shuf?'on':'';$('#rp').className=S.rep?'on':'';$('#rp').textContent=S.rep==2?'↻1':'↻';
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',r.dataset.id==S.cur));
}
const row=(id,i)=>{const t=T.get(id);return `<div class="row ${S.cur==id?'on':''}" data-id="${id}" data-i="${i}" ${REORD?'draggable="true"':''}><div class="cv" style="${cv(t)}">${ini(t)}</div><div class="tt"><b>${esc(t.title)}</b><small>${esc(t.artist)} · ${esc(t.album)}</small></div><span class="d">${fmt(t.dur)}</span><span class="d s">${t.src?'онлайн':t.fmt+' · '+mb(t.size)}</span><button data-a="fav" style="${S.fav.includes(id)?'color:#ff5e87':''}" title="Избранное">♥</button><button data-a="q" title="В очередь">＋</button><button data-a="more" title="Ещё">⋯</button></div>`};
const rows=(ids,msg)=>{LIST=ids.filter(id=>T.has(id));return LIST.length?LIST.map((id,i)=>row(id,i)).join(''):`<div class="empty">${msg||'Здесь пока пусто'}</div>`};
function libIds(){const q=Q.toLowerCase();const a=[...T.values()].filter(t=>!t.tmp).filter(t=>!q||(t.title+' '+t.artist+' '+t.album+' '+(t.genre||'')).toLowerCase().includes(q));
  a.sort(SO=='added'?(x,y)=>y.added-x.added:SO=='dur'||SO=='size'?(x,y)=>x[SO]-y[SO]:(x,y)=>x[SO].localeCompare(y[SO]));return a.map(t=>t.id)}
const nav=[['home','Главная'],['now','Плеер'],['web','Поиск в мире'],['lib','Моя музыка'],['fav','Избранное'],['hist','История'],['pls','Плейлисты'],['q','Очередь'],['eq','Эквалайзер'],['smart','Умный звук']];
const plCard=p=>{const t=T.get(p.ids.find(i=>T.has(i)))||{id:p.id};return `<div class="card" data-pl="${p.id}"><div class="cv" style="${cv(t)}">${ini(t)}</div><b>${esc(p.name)}</b><br><small>Песен: ${p.ids.length}</small></div>`};
function render(){
  REORD=null;$('#nav').innerHTML=nav.map(([k,n])=>`<button data-v="${k}" class="${view==k?'on':''}">${n}</button>`).join('');
  const m=$('#main');
  if(view=='home'){const all=[...T.values()].filter(t=>!t.tmp),tot=all.reduce((a,t)=>a+t.dur,0);
    const rec=all.sort((a,b)=>b.added-a.added).slice(0,5).map(t=>t.id),pl=S.hist.slice(0,5).map(h=>h.id);
    m.innerHTML=`<h2>Главная</h2><div class="stats"><div class="stat"><b>${all.length}</b>песен</div><div class="stat"><b>${new Set(all.map(t=>t.album)).size}</b>альбомов</div><div class="stat"><b>${new Set(all.map(t=>t.artist)).size}</b>исполнителей</div><div class="stat"><b>${(tot/3600).toFixed(1)} ч</b>вся библиотека</div></div>
    ${S.cur&&T.has(S.cur)?`<h3>Продолжить прослушивание</h3><div class="row" data-resume="1"><div class="cv" style="${cv(T.get(S.cur))}">▶</div><div class="tt"><b>${esc(T.get(S.cur).title)}</b><small>с ${fmt(S.pos)}</small></div></div>`:''}
    <h3>Недавно добавленные</h3>${rows(rec,'Нажмите «Добавить музыку» или перетащите файлы в окно')}<h3>Недавно воспроизведённые</h3>${rows(pl,'Вы ещё ничего не слушали')}
    <h3>Мои плейлисты</h3>${S.pl.length?`<div class="grid">${S.pl.map(plCard).join('')}</div>`:'<div class="empty">Плейлистов пока нет</div>'}`}

async function wfetch(rand){

      try{const ch=await J(`https://rss.applemarketingtools.com/api/v2/${cc}/music/most-played/100/songs.json`);ids=shuffle((ch.feed.results||[]).map(x=>x.id)).slice(0,40)}catch(e){console.warn('chart failed, fallback',e)}
      if(ids)list=((await J(`https://itunes.apple.com/lookup?id=${ids.join(',')}&country=${cc}`)).results||[]).filter(x=>x.previewUrl).map(mapI);

      const W=['love','night','dance','summer','dream','fire','city','star','road','heart'],term=rand?W[Math.random()*W.length|0]:WQ;

setInterval(()=>{const st=document.getElementById('snst');if(!micAn){if(st)st.textContent='Не подключено';return}
  micAn.getByteTimeDomainData(micBuf);let q=0;for(let i=0;i<512;i++){const v=(micBuf[i]-128)/128;q+=v*v}const r=Math.sqrt(q/512);
  fastL=fastL*.6+r*.4;const now=performance.now(),thr=slowL*(2.6-(S.sens||5)*.15)+.01;
  if(fastL>thr)lastHit=now;const ducked=now-lastHit<1700;
  if(ducked){if(!dSince)dSince=now}else dSince=0;
  slowL=ducked&&!(dSince&&now-dSince>4000)?slowL*.9995+r*.0005:slowL*.985+r*.015;
  const want=ducked?(S.duckTo??.3):1;duckG+=(want-duckG)*(want<duckG?.12:.035);if(Math.abs(duckG-want)<.01)duckG=want;applyVol();
  const bd=document.getElementById('duckb');if(bd)bd.style.display=duckG<.9?'inline-block':'none';if(st)st.textContent=duckG<.9?'Слышу звук: музыка приглушена':'Слушаю…'},60);
$('#main').addEventListener('change',e=>{const i=e.target.id;if(i=='lv'){S.lv=e.target.checked;persist()}else if(i=='nt'){S.night=e.target.checked;setNight();persist()}});
$('#main').addEventListener('input',e=>{const i=e.target.id,v=+e.target.value;
  if(i=='cap'){S.cap=v/100;applyVol();document.getElementById('capv').textContent=v+'%';persist()}
  else if(i=='sens'){S.sens=v;persist()}
  else if(i=='dto'){S.duckTo=v/100;document.getElementById('dtov').textContent=v+'%';persist()}});
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-sn]');if(!b)return;const k=b.dataset.sn;if(!k){stopSense();S.sense='';persist();render()}else startSense(k)});
/* ---------- init ---------- */
(async()=>{
  try{db=await idb();(await tx('readonly',s=>s.getAll())).forEach(t=>T.set(t.id,t))}catch(e){toast('Хранилище недоступно — библиотека не сохранится')}
  if(S.theme===undefined)S.theme='dark';if(S.ae===undefined)S.ae=true;if(S.cap===undefined)S.cap=.75;S.theme?root.dataset.theme=S.theme:delete root.dataset.theme;
  view=S.view||'home';SO=S.so||'added';setAccent(40);
  S.fav=S.fav.filter(i=>T.has(i));setVol(S.vol);applyEq();
  ctxList=(S.ctx||[]).length?S.ctx:[...T.keys()];
  if(S.cur&&T.has(S.cur)){play(S.cur,null,S.pos||0.01);au.pause()}
  render();requestAnimationFrame(frame);
  if(T.size)toast(`Библиотека восстановлена: ${T.size} песен`);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  upgradeTags();
  if(S.sense=='mic'&&navigator.permissions)navigator.permissions.query({name:'microphone'}).then(r=>{if(r.state=='granted')startSense('mic')}).catch(()=>{});
})();
</script></body></html>
